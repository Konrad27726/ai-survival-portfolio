<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;; connect-src &#x27;none&#x27;; object-src &#x27;none&#x27;; script-src &#x27;sha256-E6Vg0etM2Fy6JPJzM6xqpcoJb5hsIm2OntMdz7WyDq0=&#x27;; style-src &#x27;sha256-Bn+/Pz/2w9sSiHyhYg6SINmMgUPPUoSiIixiE8KAc6I=&#x27;"><title>Gradwechsel</title><style>:root{color-scheme:light;--ink:#10232a;--muted:#466169;--paper:#f1f8f5;--line:#b8d4cd;--button:#075b52;font:100%/1.55 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:58rem;margin:auto;padding:2rem clamp(1rem,5vw,3rem) 3rem}
h1,h2,p{margin:.4em 0 1em}h1{font-size:clamp(2.2rem,9vw,4.6rem);line-height:1;letter-spacing:-.055em}h2{font-size:1.25rem;line-height:1.25}
header p{max-width:54ch;color:var(--muted)}a{color:var(--button);text-decoration-thickness:2px;text-underline-offset:4px}
:focus-visible{outline:3px solid #98431b;outline-offset:4px}button,input{font:inherit}button{min-height:44px;padding:.56rem 1rem}
button{background:var(--button);color:white;border:1px solid var(--button);border-radius:.5rem;font-weight:650;cursor:pointer}
input{display:block;width:100%;max-width:24rem;padding:.65rem .8rem;background:#fff;border:2px solid #53877f;border-radius:.45rem;color:var(--ink)}
label{display:block;font-weight:650}.panel{background:#fff;border:1px solid var(--line);padding:clamp(1rem,4vw,2rem);border-radius:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:.7rem;margin:1rem 0}.state{display:block;min-height:2rem;font-size:1.15rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;margin-top:1rem}.grid article{scroll-margin-top:2rem}
nav{display:flex;flex-wrap:wrap;gap:1rem;border-block:1px solid var(--line);padding:.75rem 0}
.hero{background:#123e3e;color:#eefcf5;padding:clamp(1rem,5vw,2.5rem);margin-bottom:1rem;border-radius:1rem;display:grid;grid-template-columns:1fr .45fr;align-items:center;gap:1rem}
.hero p{color:#d3eee4;margin-bottom:0}.wheel{width:100%;max-width:11rem;aspect-ratio:1;border:13px double #c6f68a;border-radius:50%;background:repeating-conic-gradient(from 5deg,#90b8a4 0 1deg,transparent 1deg 30deg);justify-self:center}
.signal{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;max-width:27rem}.signal button{padding:.7rem .2rem;min-height:64px;background:#173a56;border-color:#173a56}.signal button:disabled{opacity:.65;cursor:default}
#pattern{min-height:1.6rem;letter-spacing:.1em}.faq{max-width:40rem}.faq details{border:1px solid var(--line);border-radius:.6rem;background:#fff;margin-bottom:.65rem}
.faq summary{padding:.8rem 1rem;font-weight:700;cursor:pointer}.faq details p{padding:0 1rem;margin:0 0 1rem}
@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.wheel{display:none}}</style></head><body><main><header><h1>Gradwechsel</h1><p>Gib einen Wert ein und rechne direkt um.</p></header><section class="panel"><label for="value">Temperatur in °C</label><input id="value" inputmode="decimal" maxlength="14" autocomplete="off"><div class="controls"><button id="calculate" type="button">Umrechnen</button></div><output id="answer" class="state" role="status" for="value">Ergebnis erscheint hier.</output></section></main><script>const DATA=["+", ["/", ["*", ["input", 0], 9], 5], 32];const UNIT="\u00b0F";
const control=document.getElementById('value'), output=document.getElementById('answer');
const operation=(node, value)=>{
  if(typeof node==='number')return node;
  const [op,a,b]=node;if(op==='input')return value;
  const left=operation(a,value),right=operation(b,value);
  return op==='+'?left+right:op==='-'?left-right:op==='*'?left*right:left/right;
};
function convert(){
  const raw=control.value.trim().replace(',','.');
  if(!/^[+-]?(?:[0-9]{1,5}(?:\.[0-9]{1,6})?|\.[0-9]{1,6})$/.test(raw)||Math.abs(Number(raw))>10000){
    control.setAttribute('aria-invalid','true');output.textContent='Bitte eine Zahl zwischen −10.000 und 10.000 eingeben.';return;
  }
  const result=operation(DATA,Number(raw));control.removeAttribute('aria-invalid');
  output.textContent=Number.isFinite(result)&&Math.abs(result)<=1e10
    ? new Intl.NumberFormat('de-DE',{maximumFractionDigits:6}).format(result)+' '+UNIT
    : 'Ergebnis außerhalb des Wertebereichs.';
}
document.getElementById('calculate').addEventListener('click',convert);
control.addEventListener('keydown',event=>{if(event.key==='Enter')convert();});</script></body></html>
